name: Feature request
description: Suggest an improvement for PathWise
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        PathWise is about calm decision maps. Say what problem you want solved, not only a UI idea.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What decision or workflow is hard today?
      placeholder: When exploring a large map, it is hard to…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would help? Keep it honest — no need for a full design.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Decision map / exploration UX
        - Auth / account
        - Billing / plans
        - Performance
        - Docs / DX
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
