name: Bug report
description: Something broken or unexpected in PathWise
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Keep it concrete — what happened vs what you expected.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug.
      placeholder: Map generation fails when…
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps someone else can follow.
      placeholder: |
        1. Go to …
        2. Click …
        3. See error …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include error messages or console output if relevant. Redact secrets.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local (`npm run dev`)
        - Production / deployed
        - Other
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / OS (optional)
      placeholder: e.g. Chrome 128 on Windows 11
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates
          required: true
        - label: I did not include secrets (.env values, API keys, tokens)
          required: true
